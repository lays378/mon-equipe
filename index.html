<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ MonÉquipe 8v8</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c518;--bg:#0f1923;--surface:#16232f;--surface2:#1d2f3f;--border:rgba(255,255,255,0.08);--text:#e8edf2;--muted:#7a8fa0;--green-dark:#0a3d1f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:2px;color:var(--gold)}
.logo em{color:#fff;font-style:normal}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;margin-left:8px;transition:background .3s}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.error{background:#e53e3e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;gap:2px}
.tab-btn{font-family:'Figtree',sans-serif;font-weight:700;font-size:14px;padding:13px 18px;background:none;border:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.view{display:none}.view.active{display:block}
.page{padding:1.5rem}
.btn{font-family:'Figtree',sans-serif;font-weight:700;font-size:14px;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:#1a1200}.btn-gold:hover{background:#e8b800;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.13)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-danger{background:rgba(220,50,50,.12);color:#ff6b6b;border:1px solid rgba(220,50,50,.25)}.btn-danger:hover{background:rgba(220,50,50,.22)}
.players-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.players-header h2{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:1px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fifa-card{width:150px;height:210px;border-radius:13px;position:relative;transition:transform .2s,box-shadow .2s;flex-shrink:0}
.fifa-card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 18px 36px rgba(0,0,0,.65)}
.card-face{width:100%;height:100%;border-radius:13px;overflow:hidden;position:relative;background:linear-gradient(145deg,#1a3a6e,#0d2248 60%,#081628);border:2px solid rgba(245,197,24,.5)}
.card-face.gold-card{background:linear-gradient(145deg,#b8860b,#8b6508 50%,#5c4100);border-color:rgba(245,220,100,.8)}
.card-face.silver-card{background:linear-gradient(145deg,#6e7a8a,#4a5568 50%,#2d3748);border-color:rgba(180,192,210,.6)}
.card-face::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 50%,rgba(255,255,255,.03) 100%);pointer-events:none;z-index:1}
.card-top{position:absolute;top:9px;left:10px;z-index:2}
.card-rating{font-family:'Bebas Neue',cursive;font-size:26px;line-height:1;color:var(--gold)}
.card-pos-label{font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.7);margin-top:2px}
.card-avatar-area{position:absolute;top:0;left:0;right:0;height:125px;display:flex;align-items:center;justify-content:center;z-index:1}
.card-avatar{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:rgba(255,255,255,.9);border:2px solid rgba(255,255,255,.18);margin-top:22px;overflow:hidden;flex-shrink:0}
.card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.card-bottom{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.88),transparent);padding:10px 8px 8px;z-index:2;text-align:center}
.card-name{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:1.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.card-number{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-top:2px}
.card-wrapper{position:relative;display:inline-block}
.card-delete{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#e53e3e;border:2px solid var(--bg);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;opacity:0;transition:opacity .2s}
.card-wrapper:hover .card-delete{opacity:1}
.card-edit{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);color:#1a1200;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;opacity:0;transition:opacity .2s}
.card-wrapper:hover .card-edit{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.75rem;width:420px;max-width:95vw;max-height:92vh;overflow-y:auto;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:1px;margin-bottom:1.25rem;color:var(--gold)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Figtree',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--gold)}
.form-group select option{background:var(--surface2)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1;justify-content:center;padding:11px}
.photo-upload-zone{width:90px;height:90px;border-radius:50%;background:var(--surface2);border:2px dashed rgba(245,197,24,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .2s;margin:0 auto 8px;flex-shrink:0}
.photo-upload-zone:hover{border-color:var(--gold)}
.photo-upload-zone img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.upload-hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.4;padding:4px;user-select:none}
.pos-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pos-btn{padding:5px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Figtree',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.pos-btn:hover,.pos-btn.selected{background:rgba(245,197,24,.15);border-color:var(--gold);color:var(--gold)}
.modal-preview{display:flex;justify-content:center;margin-bottom:1.25rem}
.pitch-controls{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.pitch-controls label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.pitch-controls select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:'Figtree',sans-serif;font-size:14px;font-weight:600;outline:none;cursor:pointer}
.pitch-container{display:grid;grid-template-columns:1fr 205px;gap:16px;align-items:start}
.pitch-wrapper{background:var(--green-dark);border-radius:14px;padding:10px;border:2px solid rgba(255,255,255,.06);box-shadow:0 0 50px rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.3);aspect-ratio:.64;position:relative;overflow:hidden}
.pitch-wrapper::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 38px,rgba(0,0,0,.07) 38px,rgba(0,0,0,.07) 76px);pointer-events:none;z-index:0}
.pitch-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pitch-slots{position:absolute;inset:0;z-index:2}
.pos-slot{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .2s}
.pos-slot.has-player{cursor:default}
.pitch-card{width:64px;height:88px;border-radius:7px;position:relative;overflow:hidden;background:linear-gradient(145deg,#1a3a6e,#081628);border:1.5px solid rgba(245,197,24,.6);box-shadow:0 4px 14px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .2s}
.pitch-card:hover{transform:scale(1.1)}
.pitch-card.gold{background:linear-gradient(145deg,#b8860b,#5c4100);border-color:rgba(245,220,100,.8)}
.pitch-card.silver{background:linear-gradient(145deg,#6e7a8a,#2d3748)}
.pitch-card-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.2);position:absolute;top:7px;overflow:hidden;flex-shrink:0}
.pitch-card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pitch-card-bottom{width:100%;text-align:center;padding:2px 3px 3px;background:rgba(0,0,0,.55)}
.pitch-card-name{font-family:'Bebas Neue',cursive;font-size:10px;letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitch-card-num{font-size:8px;color:var(--gold);font-weight:700}
.pitch-card-rating{position:absolute;top:2px;left:3px;font-family:'Bebas Neue',cursive;font-size:12px;color:var(--gold);line-height:1}
.empty-slot-circle{width:50px;height:50px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.28);font-size:18px;transition:all .2s;background:rgba(255,255,255,.03)}
.pos-slot:hover .empty-slot-circle{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.08)}
.slot-label{font-family:'Bebas Neue',cursive;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.45);margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.slot-remove{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#e53e3e;border:2px solid var(--bg);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;opacity:0;transition:opacity .2s}
.pos-slot:hover .slot-remove{opacity:1}
.bench-panel{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:.9rem}
.bench-title{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:1px;color:var(--gold);margin-bottom:10px;text-align:center}
.bench-list{display:flex;flex-direction:column;gap:7px;max-height:520px;overflow-y:auto}
.bench-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)}
.bench-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:rgba(255,255,255,.8);flex-shrink:0;overflow:hidden}
.bench-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bench-info{flex:1;min-width:0}
.bench-name{font-family:'Bebas Neue',cursive;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench-pos{font-size:10px;color:var(--muted);font-weight:600}
.bench-num{font-family:'Bebas Neue',cursive;font-size:16px;color:var(--gold)}
.bench-empty{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
.assign-list{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
.assign-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.assign-item:hover{border-color:var(--gold);background:rgba(245,197,24,.05)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .emoji{font-size:54px;margin-bottom:14px}
.empty-state h3{font-family:'Bebas Neue',cursive;font-size:22px;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:14px;margin-bottom:18px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--gold);border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;color:var(--gold);z-index:999;animation:tIn .3s ease;pointer-events:none}
@keyframes tIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:16px}
.loading-screen .logo-big{font-family:'Bebas Neue',cursive;font-size:48px;color:var(--gold)}
.spinner{width:36px;height:36px;border:3px solid rgba(245,197,24,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
@media(max-width:680px){.pitch-container{grid-template-columns:1fr}.bench-list{flex-direction:row;flex-wrap:wrap;max-height:none}.bench-item{width:calc(50% - 4px)}}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loading-screen">
  <div class="logo-big">⚽ MonÉquipe</div>
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">Connexion en cours...</div>
</div>

<header>
  <div class="logo">⚽ <em>MON</em>ÉQUIPE <span style="font-size:14px;color:var(--muted);font-family:'Figtree';font-weight:700;letter-spacing:0;margin-left:6px">8v8</span>
    <span class="sync-dot" id="sync-dot" title="Synchronisé"></span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost btn-sm" onclick="copyLink()">🔗 Lien</button>
    <button class="btn btn-danger btn-sm" onclick="resetAll()">🗑 Reset</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('players',this)">👥 Joueurs</button>
  <button class="tab-btn" onclick="switchTab('pitch',this)">⚽ Terrain</button>
</div>

<!-- PLAYERS VIEW -->
<div id="view-players" class="view active">
  <div class="page">
    <div class="players-header">
      <h2>Joueurs (<span id="count">0</span>/8)</h2>
      <button class="btn btn-gold" onclick="openAddModal()">+ Ajouter</button>
    </div>
    <div id="cards-grid" class="cards-grid"></div>
    <div id="empty-players" class="empty-state" style="display:none">
      <div class="emoji">⚽</div>
      <h3>Aucun joueur</h3>
      <p>Ajoute jusqu'à 8 joueurs dans ton équipe</p>
      <button class="btn btn-gold" onclick="openAddModal()">+ Ajouter un joueur</button>
    </div>
  </div>
</div>

<!-- PITCH VIEW -->
<div id="view-pitch" class="view">
  <div class="page">
    <div class="pitch-controls">
      <label>Formation</label>
      <select onchange="changeFormation(this.value)" id="formation-select">
        <option value="3-3-1">3-3-1</option>
        <option value="3-2-2">3-2-2</option>
        <option value="2-3-2">2-3-2</option>
        <option value="2-4-1">2-4-1</option>
        <option value="1-3-3">1-3-3</option>
        <option value="3-1-3">3-1-3</option>
        <option value="2-2-3">2-2-3</option>
      </select>
    </div>
    <div class="pitch-container">
      <div class="pitch-wrapper">
        <svg class="pitch-svg" viewBox="0 0 100 156" preserveAspectRatio="none">
          <rect x="3" y="3" width="94" height="150" fill="none" stroke="rgba(255,255,255,.16)" stroke-width=".5"/>
          <line x1="3" y1="78" x2="97" y2="78" stroke="rgba(255,255,255,.16)" stroke-width=".5"/>
          <circle cx="50" cy="78" r="11" fill="none" stroke="rgba(255,255,255,.16)" stroke-width=".5"/>
          <circle cx="50" cy="78" r=".7" fill="rgba(255,255,255,.3)"/>
          <rect x="25" y="3" width="50" height="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <rect x="35" y="3" width="30" height="8" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <circle cx="50" cy="17" r=".6" fill="rgba(255,255,255,.28)"/>
          <path d="M40 23 A11 11 0 0 1 60 23" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <rect x="25" y="133" width="50" height="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <rect x="35" y="149" width="30" height="8" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <circle cx="50" cy="139" r=".6" fill="rgba(255,255,255,.28)"/>
          <path d="M40 133 A11 11 0 0 0 60 133" fill="none" stroke="rgba(255,255,255,.14)" stroke-width=".5"/>
          <rect x="37" y="0" width="26" height="3" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.25)" stroke-width=".5"/>
          <rect x="37" y="153" width="26" height="3" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.25)" stroke-width=".5"/>
        </svg>
        <div class="pitch-slots" id="pitch-slots"></div>
      </div>
      <div class="bench-panel">
        <div class="bench-title">🪑 Remplaçants</div>
        <div class="bench-list" id="bench-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <h3 id="modal-add-title">✨ Nouveau Joueur</h3>
    <div class="modal-preview">
      <div class="fifa-card" style="width:120px;height:168px">
        <div class="card-face" id="preview-face">
          <div class="card-top"><div class="card-rating" id="prev-rating">75</div><div class="card-pos-label" id="prev-pos">POS</div></div>
          <div class="card-avatar-area"><div class="card-avatar" id="prev-avatar">?</div></div>
          <div class="card-bottom"><div class="card-name" id="prev-name">Prénom</div><div class="card-number" id="prev-number">#00</div></div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>📷 Photo du joueur</label>
      <div class="photo-upload-zone" id="photo-zone" onclick="document.getElementById('file-input').click()">
        <div class="upload-hint">📷<br>Appuyer pour<br>choisir une photo</div>
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(this)">
      <div style="text-align:center;margin-top:4px">
        <button class="btn btn-danger btn-sm" onclick="clearPhoto()" id="clear-photo-btn" style="display:none;font-size:11px">✕ Supprimer la photo</button>
      </div>
    </div>
    <div class="form-group">
      <label>Prénom / Nom</label>
      <input type="text" id="inp-name" placeholder="Ex: Mbappé" oninput="updatePreview()">
    </div>
    <div class="form-group">
      <label>Numéro de maillot</label>
      <input type="number" id="inp-number" placeholder="10" min="1" max="99" oninput="updatePreview()">
    </div>
    <div class="form-group">
      <label>Poste</label>
      <div class="pos-picker">
        <button class="pos-btn" onclick="selectPos(this,'GK')">GK</button>
        <button class="pos-btn" onclick="selectPos(this,'CB')">CB</button>
        <button class="pos-btn" onclick="selectPos(this,'LB')">LB</button>
        <button class="pos-btn" onclick="selectPos(this,'RB')">RB</button>
        <button class="pos-btn" onclick="selectPos(this,'CDM')">CDM</button>
        <button class="pos-btn" onclick="selectPos(this,'CM')">CM</button>
        <button class="pos-btn" onclick="selectPos(this,'CAM')">CAM</button>
        <button class="pos-btn" onclick="selectPos(this,'LM')">LM</button>
        <button class="pos-btn" onclick="selectPos(this,'RM')">RM</button>
        <button class="pos-btn" onclick="selectPos(this,'LW')">LW</button>
        <button class="pos-btn" onclick="selectPos(this,'RW')">RW</button>
        <button class="pos-btn" onclick="selectPos(this,'ST')">ST</button>
      </div>
    </div>
    <div class="form-group">
      <label>Note (50–99)</label>
      <input type="number" id="inp-rating" placeholder="75" min="50" max="99" value="75" oninput="updatePreview()">
    </div>
    <input type="hidden" id="inp-pos" value="">
    <input type="hidden" id="inp-editid" value="">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-add')">Annuler</button>
      <button class="btn btn-gold" id="btn-save-player" onclick="savePlayer()">✔ Ajouter</button>
    </div>
  </div>
</div>

<!-- ASSIGN MODAL -->
<div class="modal-overlay" id="modal-assign">
  <div class="modal">
    <h3 id="assign-title">Choisir un joueur</h3>
    <div class="assign-list" id="assign-list"></div>
    <div class="modal-actions" style="margin-top:14px">
      <button class="btn btn-ghost" onclick="closeModal('modal-assign')">Annuler</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCAFp4jLMxC-dMlzG0w_KH-aZwm_3Ba1I",
  authDomain: "mon-equipe-a80bd.firebaseapp.com",
  projectId: "mon-equipe-a80bd",
  storageBucket: "mon-equipe-a80bd.firebasestorage.app",
  messagingSenderId: "195327130394",
  appId: "1:195327130394:web:e73fd9b7dd1833e9334aa3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC_REF = doc(db, "equipe", "main");

let players = [];
let lineup = {};
let currentFormation = '3-3-1';
let selectedPos = '';
let assigningSlot = null;
let currentPhotoB64 = '';
let isSaving = false;

const FORMATIONS = {
  '3-3-1':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:18,y:74,label:'LB'},{id:'CB',x:50,y:74,label:'CB'},{id:'RB',x:82,y:74,label:'RB'},{id:'LM',x:18,y:52,label:'LM'},{id:'CM',x:50,y:50,label:'CM'},{id:'RM',x:82,y:52,label:'RM'},{id:'ST',x:50,y:28,label:'ST'}],
  '3-2-2':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:18,y:74,label:'LB'},{id:'CB',x:50,y:74,label:'CB'},{id:'RB',x:82,y:74,label:'RB'},{id:'CM1',x:30,y:53,label:'CM'},{id:'CM2',x:70,y:53,label:'CM'},{id:'LW',x:22,y:30,label:'LW'},{id:'RW',x:78,y:30,label:'RW'}],
  '2-3-2':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:26,y:75,label:'LB'},{id:'RB',x:74,y:75,label:'RB'},{id:'LM',x:18,y:54,label:'LM'},{id:'CM',x:50,y:52,label:'CM'},{id:'RM',x:82,y:54,label:'RM'},{id:'ST1',x:30,y:28,label:'ST'},{id:'ST2',x:70,y:28,label:'ST'}],
  '2-4-1':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:26,y:75,label:'LB'},{id:'RB',x:74,y:75,label:'RB'},{id:'LM',x:14,y:54,label:'LM'},{id:'CM1',x:38,y:52,label:'CM'},{id:'CM2',x:62,y:52,label:'CM'},{id:'RM',x:86,y:54,label:'RM'},{id:'ST',x:50,y:27,label:'ST'}],
  '1-3-3':[{id:'GK',x:50,y:91,label:'GK'},{id:'SW',x:50,y:75,label:'SW'},{id:'LM',x:18,y:56,label:'LM'},{id:'CM',x:50,y:54,label:'CM'},{id:'RM',x:82,y:56,label:'RM'},{id:'LW',x:18,y:30,label:'LW'},{id:'ST',x:50,y:27,label:'ST'},{id:'RW',x:82,y:30,label:'RW'}],
  '3-1-3':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:18,y:74,label:'LB'},{id:'CB',x:50,y:74,label:'CB'},{id:'RB',x:82,y:74,label:'RB'},{id:'CM',x:50,y:55,label:'CM'},{id:'LW',x:18,y:30,label:'LW'},{id:'ST',x:50,y:27,label:'ST'},{id:'RW',x:82,y:30,label:'RW'}],
  '2-2-3':[{id:'GK',x:50,y:91,label:'GK'},{id:'LB',x:26,y:75,label:'LB'},{id:'RB',x:74,y:75,label:'RB'},{id:'CM1',x:30,y:57,label:'CM'},{id:'CM2',x:70,y:57,label:'CM'},{id:'LW',x:16,y:31,label:'LW'},{id:'ST',x:50,y:27,label:'ST'},{id:'RW',x:84,y:31,label:'RW'}]
};

// ===== FIREBASE =====
function setSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : status === 'error' ? ' error' : '');
  dot.title = status === 'ok' ? 'Synchronisé ✅' : status === 'syncing' ? 'Sauvegarde...' : 'Erreur de connexion';
}

async function saveToFirebase() {
  if (isSaving) return;
  isSaving = true;
  setSyncStatus('syncing');
  try {
    await setDoc(DOC_REF, { players, lineup, formation: currentFormation });
    setSyncStatus('ok');
  } catch(e) {
    console.error(e);
    setSyncStatus('error');
    toast('❌ Erreur de sauvegarde');
  }
  isSaving = false;
}

// Real-time listener
let isFirstLoad = true;
onSnapshot(DOC_REF, (snap) => {
  if (!snap.exists()) { document.getElementById('loading-screen').style.display='none'; renderPlayers(); return; }
  const data = snap.data();
  players = data.players || [];
  lineup = data.lineup || {};
  currentFormation = data.formation || '3-3-1';
  document.getElementById('formation-select').value = currentFormation;
  if (isFirstLoad) {
    document.getElementById('loading-screen').style.display = 'none';
    isFirstLoad = false;
  }
  renderPlayers();
  if (document.getElementById('view-pitch').classList.contains('active')) renderPitch();
  setSyncStatus('ok');
}, (err) => {
  console.error(err);
  document.getElementById('loading-screen').style.display = 'none';
  setSyncStatus('error');
});

// ===== TABS =====
window.switchTab = function(tab, btn) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'pitch') renderPitch();
};

// ===== HELPERS =====
function getInitials(name) {
  const p = name.trim().split(' ');
  return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase();
}
function getCardClass(r){return r>=85?'gold-card':r>=75?'silver-card':'';}
function getPitchCardClass(r){return r>=85?'gold':r>=75?'silver':'';}
function avatarHtml(p){return p.photo?`<img src="${p.photo}" alt="">`:(p.name?getInitials(p.name):'?');}

function renderCard(p, mini=false) {
  const av = avatarHtml(p);
  if (mini) return `<div class="pitch-card ${getPitchCardClass(p.rating||75)}">
    <span class="pitch-card-rating">${p.rating||75}</span>
    <div class="pitch-card-avatar">${av}</div>
    <div class="pitch-card-bottom"><div class="pitch-card-name">${p.name||'?'}</div><div class="pitch-card-num">#${p.number||0}</div></div>
  </div>`;
  return `<div class="card-face ${getCardClass(p.rating||75)}">
    <div class="card-top"><div class="card-rating">${p.rating||75}</div><div class="card-pos-label">${p.position||'?'}</div></div>
    <div class="card-avatar-area"><div class="card-avatar">${av}</div></div>
    <div class="card-bottom"><div class="card-name">${p.name||'?'}</div><div class="card-number">#${p.number||'00'}</div></div>
  </div>`;
}

function renderPlayers() {
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-players');
  document.getElementById('count').textContent = players.length;
  if (!players.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML = players.map(p=>`
    <div class="card-wrapper">
      <div class="fifa-card">${renderCard(p)}</div>
      <div class="card-edit" onclick="openEditModal('${p.id}')" title="Modifier">✎</div>
      <div class="card-delete" onclick="deletePlayer('${p.id}')" title="Supprimer">✕</div>
    </div>
  `).join('');
}

// ===== PHOTO =====
window.handlePhotoUpload = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxS=180; let w=img.width,h=img.height;
      if(w>h){if(w>maxS){h=h*maxS/w;w=maxS;}}else{if(h>maxS){w=w*maxS/h;h=maxS;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      currentPhotoB64 = canvas.toDataURL('image/jpeg',0.72);
      showPhotoPreview(currentPhotoB64);
      updatePreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

function showPhotoPreview(src) {
  document.getElementById('photo-zone').innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  document.getElementById('clear-photo-btn').style.display='inline-flex';
}

window.clearPhoto = function() {
  currentPhotoB64='';
  document.getElementById('photo-zone').innerHTML='<div class="upload-hint">📷<br>Appuyer pour<br>choisir une photo</div>';
  document.getElementById('clear-photo-btn').style.display='none';
  document.getElementById('file-input').value='';
  updatePreview();
};

// ===== MODALS =====
window.openAddModal = function() {
  selectedPos='';currentPhotoB64='';
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('inp-name').value='';
  document.getElementById('inp-number').value='';
  document.getElementById('inp-rating').value='75';
  document.getElementById('inp-pos').value='';
  document.getElementById('inp-editid').value='';
  document.getElementById('photo-zone').innerHTML='<div class="upload-hint">📷<br>Appuyer pour<br>choisir une photo</div>';
  document.getElementById('clear-photo-btn').style.display='none';
  document.getElementById('file-input').value='';
  document.getElementById('modal-add-title').textContent='✨ Nouveau Joueur';
  document.getElementById('btn-save-player').textContent='✔ Ajouter';
  updatePreview();
  document.getElementById('modal-add').classList.add('open');
};

window.openEditModal = function(id) {
  const p = players.find(x=>x.id===id);
  if (!p) return;
  selectedPos=p.position||'';
  currentPhotoB64=p.photo||'';
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.toggle('selected',b.textContent===selectedPos));
  document.getElementById('inp-name').value=p.name||'';
  document.getElementById('inp-number').value=p.number||'';
  document.getElementById('inp-rating').value=p.rating||75;
  document.getElementById('inp-pos').value=p.position||'';
  document.getElementById('inp-editid').value=p.id;
  document.getElementById('file-input').value='';
  if(p.photo)showPhotoPreview(p.photo);
  else{document.getElementById('photo-zone').innerHTML='<div class="upload-hint">📷<br>Appuyer pour<br>choisir une photo</div>';document.getElementById('clear-photo-btn').style.display='none';}
  document.getElementById('modal-add-title').textContent='✏️ Modifier le Joueur';
  document.getElementById('btn-save-player').textContent='✔ Sauvegarder';
  updatePreview();
  document.getElementById('modal-add').classList.add('open');
};

window.selectPos = function(btn, pos) {
  document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPos=pos;
  document.getElementById('inp-pos').value=pos;
  updatePreview();
};

function updatePreview() {
  const name=document.getElementById('inp-name').value||'Prénom';
  const num=document.getElementById('inp-number').value||'00';
  const pos=selectedPos||'POS';
  const rating=parseInt(document.getElementById('inp-rating').value)||75;
  document.getElementById('prev-rating').textContent=rating;
  document.getElementById('prev-pos').textContent=pos;
  document.getElementById('prev-name').textContent=name;
  document.getElementById('prev-number').textContent='#'+num;
  document.getElementById('prev-avatar').innerHTML=currentPhotoB64
    ?`<img src="${currentPhotoB64}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    :(name!=='Prénom'?getInitials(name):'?');
  document.getElementById('preview-face').className='card-face '+getCardClass(rating);
}
window.updatePreview = updatePreview;

window.savePlayer = async function() {
  const name=document.getElementById('inp-name').value.trim();
  const number=document.getElementById('inp-number').value;
  const pos=selectedPos;
  const rating=parseInt(document.getElementById('inp-rating').value)||75;
  const photo=currentPhotoB64;
  const editId=document.getElementById('inp-editid').value;
  if(!name){toast('⚠️ Saisis un prénom !');return;}
  if(!pos){toast('⚠️ Sélectionne un poste !');return;}
  if(!number){toast('⚠️ Saisis un numéro !');return;}
  if(editId){
    const idx=players.findIndex(p=>p.id===editId);
    if(idx!==-1)players[idx]={...players[idx],name,number:parseInt(number),position:pos,rating,photo};
    toast('✅ '+name+' modifié !');
  } else {
    if(players.length>=8){toast('⚠️ Max 8 joueurs !');return;}
    players.push({id:Date.now().toString(),name,number:parseInt(number),position:pos,rating,photo});
    toast('🎉 '+name+' ajouté !');
  }
  closeModal('modal-add');
  await saveToFirebase();
};

window.deletePlayer = async function(id) {
  players=players.filter(p=>p.id!==id);
  Object.keys(lineup).forEach(k=>{if(lineup[k]===id)delete lineup[k];});
  await saveToFirebase();
};

window.resetAll = async function() {
  if(!confirm('Remettre à zéro toute l\'équipe ?'))return;
  players=[];lineup={};
  await saveToFirebase();
  toast('🗑 Équipe réinitialisée');
};

// ===== PITCH =====
window.changeFormation = async function(f) {
  currentFormation=f;
  const slots=FORMATIONS[f];
  Object.keys(lineup).forEach(k=>{if(!slots.find(s=>s.id===k))delete lineup[k];});
  await saveToFirebase();
  renderPitch();
};

function renderPitch() {
  const slots=FORMATIONS[currentFormation];
  const container=document.getElementById('pitch-slots');
  container.innerHTML=slots.map(slot=>{
    const pid=lineup[slot.id];
    const player=pid?players.find(p=>p.id===pid):null;
    if(player)return `<div class="pos-slot has-player" style="left:${slot.x}%;top:${slot.y}%">
      <div style="position:relative">${renderCard(player,true)}<div class="slot-remove" onclick="removeFromSlot('${slot.id}')">✕</div></div>
    </div>`;
    return `<div class="pos-slot" style="left:${slot.x}%;top:${slot.y}%" onclick="openAssign('${slot.id}','${slot.label}')">
      <div class="empty-slot-circle">+</div>
      <div class="slot-label">${slot.label}</div>
    </div>`;
  }).join('');
  renderBench();
}

window.removeFromSlot = async function(slotId) {
  delete lineup[slotId];
  await saveToFirebase();
  renderPitch();
};

function renderBench() {
  const inLineup=new Set(Object.values(lineup));
  const bench=players.filter(p=>!inLineup.has(p.id));
  const list=document.getElementById('bench-list');
  if(!bench.length){list.innerHTML='<div class="bench-empty">✅ Tous sur le terrain</div>';return;}
  list.innerHTML=bench.map(p=>`<div class="bench-item">
    <div class="bench-avatar">${avatarHtml(p)}</div>
    <div class="bench-info"><div class="bench-name">${p.name}</div><div class="bench-pos">${p.position} · ${p.rating}</div></div>
    <div class="bench-num">#${p.number}</div>
  </div>`).join('');
}

// ===== ASSIGN =====
window.openAssign = function(slotId, label) {
  assigningSlot=slotId;
  const inLineup=new Set(Object.values(lineup));
  const available=players.filter(p=>!inLineup.has(p.id));
  document.getElementById('assign-title').textContent='Slot '+label+' — Choisir';
  const list=document.getElementById('assign-list');
  if(!available.length){
    list.innerHTML='<p style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0">Aucun joueur disponible.</p>';
  } else {
    list.innerHTML=available.map(p=>`<div class="assign-item" onclick="assignPlayer('${p.id}')">
      <div class="bench-avatar">${avatarHtml(p)}</div>
      <div class="bench-info"><div class="bench-name">${p.name}</div><div class="bench-pos">${p.position}</div></div>
      <div class="bench-num">#${p.number}</div>
      <span style="color:var(--gold);font-family:'Bebas Neue';font-size:20px">${p.rating}</span>
    </div>`).join('');
  }
  document.getElementById('modal-assign').classList.add('open');
};

window.assignPlayer = async function(pid) {
  if(assigningSlot){lineup[assigningSlot]=pid;await saveToFirebase();}
  closeModal('modal-assign');
  renderPitch();
};

// ===== UTILS =====
window.closeModal = function(id){document.getElementById(id).classList.remove('open');assigningSlot=null;};
window.copyLink = function(){
  navigator.clipboard.writeText(window.location.href).then(()=>toast('🔗 Lien copié !')).catch(()=>toast('Copie le lien dans la barre d\'adresse'));
};

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);});
});

window.addEventListener('resize',()=>{if(document.getElementById('view-pitch').classList.contains('active'))renderPitch();});
</script>
